<svg class="fig" viewBox="0 0 760 525" role="img" aria-labelledby="mo1t mo1d"><title id="mo1t">Sidereal month and synodic month</title><desc id="mo1d">Seen from above the North Pole. The Sun is on the left; the Earth moves counterclockwise round it. At the start the Moon is full, on the far side of the Earth from the Sun, and lined up with a far-off star. One sidereal month later the Earth has moved on round the Sun. The Moon is lined up with the same far-off star again, but it is not yet opposite the Sun, so it must go a little farther round the Earth before it is full again: that is the synodic month.</desc>
