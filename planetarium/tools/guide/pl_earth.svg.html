<svg class="fig" viewBox="0 0 760 500" role="img" aria-labelledby="pl1t pl1d"><title id="pl1t">Why the pole’s altitude is your latitude</title><desc id="pl1d">A cut through the Earth with north at the top. An observer stands at latitude phi: the angle at the centre between the equator and the observer. The horizon there is the line touching the Earth at the observer. The celestial pole is so far away that the direction to it, seen from anywhere, is parallel to the Earth's axis, straight up the page. The angle between the northern horizon and that direction, the pole's altitude, is the same angle phi.</desc><defs><marker id="plh" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ahead"/></marker><marker id="plo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="aheado"/></marker></defs>
