<svg class="fig" viewBox="0 0 760 320" role="img" aria-labelledby="es1t es1d"><title id="es1t">The Moon’s shadow on the Earth</title><desc id="es1d">Side view, not to scale. Lines touching the edges of the Sun and of the Moon outline the Moon’s shadow. The dark umbra narrows to a point that just reaches the Earth’s surface at Richmond, where the eclipse is total. Around it the pale penumbra spreads out; Atlanta, a few hundred kilometres away, is inside the penumbra, where only part of the Sun is covered.</desc>
