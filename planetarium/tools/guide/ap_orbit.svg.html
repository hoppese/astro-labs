<svg class="fig" viewBox="0 0 760 520" role="img" aria-labelledby="ap1t ap1d"><title id="ap1t">The Moon’s oval orbit</title><desc id="ap1d">Seen from above the North Pole: the Moon’s orbit is an oval with the Earth not at its middle but at a focus, off to one side. The nearest point is perigee, the farthest apogee. The perigee distance is a times one minus e, the apogee distance a times one plus e. The oval is drawn far more squashed than it really is.</desc>
<ellipse class="orbitc" cx="380" cy="250" rx="250" ry="200.0"/>
<circle cx="380" cy="250" r="2.5" class="dotc2"/><text class="lbl sm" x="380" y="240" text-anchor="middle">middle of the oval</text>
<circle class="earth" cx="230.0" cy="250.0" r="18"/><text x="230.0" y="254.0" text-anchor="middle" style="font: 600 10.5px var(--sans); fill:#fff">NP</text>
<text class="lbl" x="230.0" y="222" text-anchor="middle">Earth</text>
<circle class="moon" cx="130.0" cy="250.0" r="11"/>
<text class="lbl" x="112.0" y="248.0" text-anchor="end">perigee</text><text class="lbl sm" x="112.0" y="265.0" text-anchor="end">nearest</text>
<circle class="moon" cx="630.0" cy="250.0" r="11"/>
<text class="lbl" x="648.0" y="248.0" text-anchor="start">apogee</text><text class="lbl sm" x="648.0" y="265.0" text-anchor="start">farthest</text>
<path d="M130.0,476.0 H230.0 M130.0,470.0 v12 M230.0,470.0 v12" style="fill:none;stroke:#d2691e;stroke-width:1.6"/>
<text class="lbl" x="180.0" y="468.0" text-anchor="middle" style="fill:#d2691e"><tspan font-style="italic">a</tspan>(1 − <tspan font-style="italic">e</tspan>)</text>
<path d="M230.0,476.0 H630.0 M230.0,470.0 v12 M630.0,470.0 v12" style="fill:none;stroke:var(--f-ink);stroke-width:1.6"/>
<text class="lbl" x="430.0" y="468.0" text-anchor="middle" style="fill:var(--f-ink)"><tspan font-style="italic">a</tspan>(1 + <tspan font-style="italic">e</tspan>)</text>
<line class="guide-l" x1="130.0" y1="250" x2="130.0" y2="476.0"/>
<line class="guide-l" x1="230.0" y1="250" x2="230.0" y2="476.0"/>

<line class="guide-l" x1="380" y1="36.0" x2="380" y2="250"/><line class="guide-l" x1="630.0" y1="36.0" x2="630.0" y2="250"/>
