<svg class="fig" viewBox="0 0 760 380" role="img" aria-labelledby="pl2t pl2d"><title id="pl2t">The pole star circles the pole</title><desc id="pl2d">Looking north. The celestial pole is a point above the northern horizon. The pole star is not exactly at the pole: once a day it goes round it, counterclockwise, on a small circle. On the meridian above the pole it is at its highest; twelve hours later, on the meridian below the pole, it is at its lowest. The pole is halfway between the two.</desc><defs><marker id="plh" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ahead"/></marker><marker id="plo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="aheado"/></marker></defs>
