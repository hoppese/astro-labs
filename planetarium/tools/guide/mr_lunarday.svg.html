<svg class="fig" viewBox="0 0 760 380" role="img" aria-labelledby="mr2t mr2d"><title id="mr2t">Why the lunar day is longer than 24 hours</title><desc id="mr2d">Seen from above the north pole: the Earth turns, and the Moon moves along its orbit in the same direction. When the Earth has turned once, the Moon has moved on, so the Earth must turn a little farther to bring the Moon back overhead.</desc><defs><marker id="mrh" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ahead"/></marker></defs>

<line class="sight" x1="311.5" y1="197.2" x2="407.5" y2="210.7"/>

<text class="lbl sm" x="750" y="370" text-anchor="end">seen from above the North Pole · the Moon’s daily step exaggerated · not to scale</text>
</svg>
