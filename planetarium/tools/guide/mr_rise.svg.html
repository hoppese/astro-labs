<svg class="fig" viewBox="0 0 760 290" role="img" aria-labelledby="mr1t mr1d"><title id="mr1t">The Moon rising on the equator and farther north</title><desc id="mr1d">Left: on the equator the rising Moon moves straight up; from the moment its top edge touches the horizon to the moment its bottom edge clears it, it moves one diameter. Right: at latitude 40 degrees north it rises at a slant, and to clear the horizon it must move farther along its slanted path.</desc>
<text class="lbl" x="175" y="26" text-anchor="middle">On the equator</text>
<line class="path" x1="175.0" y1="248.0" x2="175.0" y2="62.0"/>
<rect class="ground" x="20" y="150" width="320" height="78"/><line class="horizon" x1="20" y1="150" x2="340" y2="150"/>
<circle class="moon hidden" cx="175.0" cy="178.0" r="28"/><circle class="moon" cx="175.0" cy="122.0" r="28"/>
<path class="arrow light" d="M175.0,178.0 L175.0,122.0"/>
<circle cx="175.0" cy="178.0" r="2.5" class="dotl"/><circle cx="175.0" cy="122.0" r="2.5" class="dotc2"/>
<text class="lbl sm" x="211.0" y="116.0">mark 2: the bottom</text><text class="lbl sm" x="211.0" y="132.0">edge clears</text>
<text class="lbl sm onground" x="30" y="174">mark 1 (dashed):</text><text class="lbl sm onground" x="30" y="191">top edge on</text><text class="lbl sm onground" x="30" y="208">the horizon</text>
<text class="lbl sm" x="175" y="250" text-anchor="middle">the path goes straight up: one diameter</text>
<text class="lbl" x="565" y="26" text-anchor="middle">At 40° north</text>
<line class="path" x1="496.5" y1="231.6" x2="627.1" y2="76.0"/>
<rect class="ground" x="410" y="150" width="320" height="78"/><line class="horizon" x1="410" y1="150" x2="730" y2="150"/>
<circle class="moon hidden" cx="541.5" cy="178.0" r="28"/><circle class="moon" cx="588.5" cy="122.0" r="28"/>
<path class="arrow light" d="M541.5,178.0 L588.5,122.0"/>
<circle cx="541.5" cy="178.0" r="2.5" class="dotl"/><circle cx="588.5" cy="122.0" r="2.5" class="dotc2"/>
<text class="lbl sm" x="624.5" y="116.0">mark 2: the bottom</text><text class="lbl sm" x="624.5" y="132.0">edge clears</text>
<text class="lbl sm onground" x="420" y="174">mark 1 (dashed):</text><text class="lbl sm onground" x="420" y="191">top edge on</text><text class="lbl sm onground" x="420" y="208">the horizon</text>
<text class="lbl sm" x="565" y="250" text-anchor="middle">the path is tilted: farther to go</text>
</svg>
