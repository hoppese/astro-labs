<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Interactive H-R Diagram</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, sans-serif; background: #fff; color: #333; padding: 1rem; }
  h2 { font-size: 16px; font-weight: 500; margin-bottom: 0.75rem; }
  .readout { display: flex; flex-wrap: wrap; gap: 16px; margin: 0 0 0.75rem 70px; }
  .readout-card { background: #f3f3f3; border-radius: 8px; padding: 8px 16px; min-width: 110px; }
  .readout-label { font-size: 11px; color: #777; margin-bottom: 2px; }
  .readout-value { font-size: 20px; font-weight: 500; color: #111; }
  .readout-value.range { font-size: 15px; padding-top: 4px; }
  .toggles { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 0.75rem 0; max-width:560px; justify-content: center; }
  .toggle-btn {
    padding: 5px 14px; border-radius: 20px; border: 2px solid #ccc;
    background: #fff; cursor: pointer; font-size: 13px; font-weight: 500;
    color: #555; transition: all 0.15s;
  }
  .toggle-btn.active { color: #fff; border-color: transparent; }
  .diagram-wrap { position: relative; width: 560px; }
  .slider-wrap { position: absolute; bottom: -32px; left: 70px; width: 460px; display:flex; align-items:center; gap:0; }
  .slider-wrap .hot-label { font-size:13px; color:#666; white-space:nowrap; position:absolute; right: 100%; padding-right:8px; }
  .slider-wrap .cool-label { font-size:13px; color:#666; white-space:nowrap; position:absolute; left: 100%; padding-left:8px; }
  .slider-wrap input[type=range] { width: 100%; margin:0; padding:0; }
</style>
</head>
<body>

<h2>H-R Diagram</h2>

<div class="readout">
  <div class="readout-card">
    <div class="readout-label">Spectral type</div>
    <div class="readout-value" id="out-type">G2</div>
  </div>
  <div class="readout-card">
    <div class="readout-label">Luminosity class</div>
    <div class="readout-value" id="out-class">V</div>
  </div>
  <div class="readout-card" style="min-width:180px;">
    <div class="readout-label">Absolute magnitude range</div>
    <div class="readout-value range" id="out-mag">+4.3 to +5.3</div>
  </div>
</div>

<div class="toggles" id="toggles"></div>

<div class="diagram-wrap">
  <svg id="hr" viewBox="0 0 560 560" width="560" height="560" style="display:block;"></svg>
  <div class="slider-wrap">
    <span class="hot-label">← Hot</span>
    <input type="range" id="slider" min="0" max="70" value="42" step="0.5">
    <span class="cool-label">Cool →</span>
  </div>
</div>
<div style="height:40px;"></div>

<script>
var svg = document.getElementById('hr');
var NS = 'http://www.w3.org/2000/svg';
var L=70, R=30, T=20, B=60, W=560, H=560;
var pw=W-L-R, ph=H-T-B;
var maxT=70;
var textCol='#333', gridCol='rgba(0,0,0,0.07)', axisCol='rgba(0,0,0,0.3)';
var sunCol='#EF9F27', crossCol='#378ADD';
var magMin=-15, magMax=20, magRange=35;

function magY(m) { return T+((m-magMin)/magRange)*ph; }
function typeX(t) { return L+(t/maxT)*pw; }
function typeLabel(t) {
  var cls=Math.min(Math.floor(t/10),6), sub=Math.round(t%10);
  return ['O','B','A','F','G','K','M'][cls]+sub;
}
function interp(points,t) {
  if (t<=points[0][0]) return points[0][1];
  if (t>=points[points.length-1][0]) return points[points.length-1][1];
  for (var i=0;i<points.length-1;i++) {
    var t0=points[i][0],m0=points[i][1],t1=points[i+1][0],m1=points[i+1][1];
    if (t>=t0&&t<=t1) return m0+(t-t0)/(t1-t0)*(m1-m0);
  }
  return points[points.length-1][1];
}
function mk(tag,attrs) {
  var el=document.createElementNS(NS,tag);
  for (var k in attrs) el.setAttribute(k,attrs[k]);
  return el;
}
function txt(content,attrs) {
  var el=mk('text',attrs); el.textContent=content; return el;
}
function fmtMag(m) { return (m>=0?'+':'')+m.toFixed(1); }
function bandPath(upper,lower) {
  var d=upper.map(function(p,i){
    return (i===0?'M':'L')+typeX(p[0]).toFixed(1)+','+magY(p[1]).toFixed(1);
  }).join(' ');
  var rev=lower.slice().reverse();
  d+=' '+rev.map(function(p){
    return 'L'+typeX(p[0]).toFixed(1)+','+magY(p[1]).toFixed(1);
  }).join(' ')+' Z';
  return d;
}

var classes=[
  {
    id:'I', label:'Supergiants (I)', shortLabel:'I',
    color:'#C0392B',
    upper:[[10,-9],[20,-8.5],[30,-8],[40,-7.5],[50,-7],[60,-6.5],[70,-5.5]],
    lower:[[10,-6.5],[20,-6],[30,-5.5],[40,-5],[50,-4.5],[60,-4],[70,-3.5]]
  },
  {
    id:'III', label:'Giants (III)', shortLabel:'III',
    color:'#8E44AD',
    upper:[[10,-3],[20,-1.5],[30,-0.5],[40,0],[50,0.5],[60,0],[65,-0.5],[70,-1]],
    lower:[[10,-1],[20,0.5],[30,1.5],[40,2],[50,2.5],[60,2],[65,1.5],[70,1]]
  },
  {
    id:'V', label:'Main Sequence (V)', shortLabel:'V',
    color:'#1A5276',
    upper:[[0,-10.5],[3,-8.5],[6,-6.5],[10,-4.7],[14,-3],[18,-1.5],[20,-0.3],[25,1],
           [30,1.7],[35,2.4],[40,3],[45,3.5],[48,4],[50,4.3],[55,5],[60,6],[65,7.3],[70,9]],
    lower:[[0,-9.5],[3,-7.5],[6,-5.5],[10,-3.7],[14,-2],[18,-0.5],[20,0.7],[25,2],
           [30,2.7],[35,3.4],[40,4],[45,4.5],[48,5],[50,5.3],[55,6],[60,7],[65,8.3],[70,10]]
  },
  {
    id:'WD', label:'White Dwarfs (WD)', shortLabel:'WD',
    color:'#2980B9',
    upper:[[10,9],[20,9.5],[30,10],[40,11],[50,12],[60,13],[70,14]],
    lower:[[10,11],[20,11.5],[30,12],[40,13],[50,14],[60,15],[70,16]]
  }
];

svg.appendChild(mk('rect',{x:0,y:0,width:W,height:H,fill:'none'}));

for (var m=-15;m<=20;m+=5) {
  var gy=magY(m);
  if (gy<T||gy>T+ph) continue;
  svg.appendChild(mk('line',{x1:L,y1:gy,x2:L+pw,y2:gy,stroke:gridCol,'stroke-width':'0.5'}));
  svg.appendChild(txt(m>0?'+'+m:(m===0?'0':String(m)),
    {x:L-6,y:gy+4,'text-anchor':'end','font-size':'11',fill:textCol}));
}
svg.appendChild(txt('Absolute magnitude',{
  x:14,y:T+ph/2,'text-anchor':'middle','font-size':'12',fill:textCol,
  transform:'rotate(-90,14,'+(T+ph/2)+')'
}));
svg.appendChild(txt('Bright',{x:L-6,y:T-10,'text-anchor':'end','font-size':'10',fill:textCol}));
svg.appendChild(txt('Dim',   {x:L-6,y:T+ph+18,'text-anchor':'end','font-size':'10',fill:textCol}));

['O','B','A','F','G','K','M'].forEach(function(cls,ci) {
  var xStart=typeX(ci*10), xEnd=typeX((ci+1)*10), xMid=(xStart+xEnd)/2;
  svg.appendChild(mk('line',{x1:xStart,y1:T,x2:xStart,y2:T+ph,stroke:axisCol,'stroke-width':'1.5'}));
  svg.appendChild(txt(cls,{x:xMid,y:T+ph+20,'text-anchor':'middle',
    'font-size':'14','font-weight':'600',fill:textCol}));
  for (var s=1;s<=9;s++) {
    var xs=typeX(ci*10+s);
    svg.appendChild(mk('line',{x1:xs,y1:T+ph,x2:xs,y2:T+ph+5,stroke:axisCol,'stroke-width':'0.5'}));
  }
});
svg.appendChild(txt('Spectral type',{x:L+pw/2,y:T+ph+42,
  'text-anchor':'middle','font-size':'13',fill:textCol}));
svg.appendChild(mk('rect',{x:L,y:T,width:pw,height:ph,
  fill:'none',stroke:axisCol,'stroke-width':'0.75'}));

var bandEls={}, labelEls={};
classes.forEach(function(cls) {
  var band=mk('path',{d:bandPath(cls.upper,cls.lower),
    fill:cls.color,opacity:'0.12','stroke-width':'0'});
  svg.appendChild(band);
  bandEls[cls.id]=band;

  var centerPts=cls.upper.map(function(p){
    return [p[0],(p[1]+interp(cls.lower,p[0]))/2];
  });
  var cd=centerPts.map(function(p,i){
    return (i===0?'M':'L')+typeX(p[0]).toFixed(1)+','+magY(p[1]).toFixed(1);
  }).join(' ');
  var cline=mk('path',{d:cd,fill:'none',stroke:cls.color,'stroke-width':'1.5',
    'stroke-linejoin':'round',
    'stroke-dasharray':cls.id==='WD'?'6 3':'none',opacity:'0.2'});
  svg.appendChild(cline);
  bandEls[cls.id+'_line']=cline;

  var lastU=cls.upper[cls.upper.length-1];
  var lastL=cls.lower[cls.lower.length-1];
  var lbl=txt(cls.shortLabel,{
    x:typeX(lastU[0])+5,y:magY((lastU[1]+lastL[1])/2)+4,
    'font-size':'11','font-weight':'600',fill:cls.color,opacity:'0.25'});
  svg.appendChild(lbl);
  labelEls[cls.id]=lbl;
});

var sunT=42, sunPts=[];
for (var si=0;si<10;si++){
  var sr=si%2===0?8:4, sa=(si*36-90)*Math.PI/180;
  sunPts.push((sr*Math.cos(sa)).toFixed(1)+','+(sr*Math.sin(sa)).toFixed(1));
}
var sunX=typeX(sunT);
var sunMid=(interp(classes[2].upper,sunT)+interp(classes[2].lower,sunT))/2;
var sunY=magY(sunMid);
svg.appendChild(mk('polygon',{points:sunPts.join(' '),fill:sunCol,
  transform:'translate('+sunX+','+sunY+')'}));
svg.appendChild(txt('Sun',{x:sunX+12,y:sunY-10,'font-size':'11',fill:textCol}));

var crossG=document.createElementNS(NS,'g');
var vLine=mk('line',{x1:0,y1:T,x2:0,y2:T+ph,stroke:crossCol,'stroke-width':'1.5','stroke-dasharray':'4 3'});
var hLineU=mk('line',{x1:L,y1:0,x2:L+pw,y2:0,stroke:crossCol,'stroke-width':'1','stroke-dasharray':'2 3',opacity:'0.7'});
var hLineL=mk('line',{x1:L,y1:0,x2:L+pw,y2:0,stroke:crossCol,'stroke-width':'1','stroke-dasharray':'2 3',opacity:'0.7'});
var dotU=mk('circle',{r:'4',fill:crossCol,opacity:'0.8'});
var dotL=mk('circle',{r:'4',fill:crossCol,opacity:'0.8'});
crossG.appendChild(vLine);
crossG.appendChild(hLineU); crossG.appendChild(hLineL);
crossG.appendChild(dotU);   crossG.appendChild(dotL);
svg.appendChild(crossG);

var slider=document.getElementById('slider');
var outType=document.getElementById('out-type');
var outMag=document.getElementById('out-mag');
var outClass=document.getElementById('out-class');
var activeId='V';

function setActive(id) {
  activeId=id;
  classes.forEach(function(cls) {
    var on=cls.id===id;
    bandEls[cls.id].setAttribute('opacity',on?'0.25':'0.08');
    bandEls[cls.id+'_line'].setAttribute('opacity',on?'0.9':'0.15');
    labelEls[cls.id].setAttribute('opacity',on?'1':'0.2');
  });
  outClass.textContent=id;
  update(parseFloat(slider.value));
}

var toggleContainer=document.getElementById('toggles');
classes.forEach(function(cls) {
  var btn=document.createElement('button');
  btn.className='toggle-btn'+(cls.id===activeId?' active':'');
  btn.textContent=cls.label;
  btn.style.borderColor=cls.color;
  if (cls.id===activeId){btn.style.backgroundColor=cls.color;btn.style.color='#fff';}
  btn.addEventListener('click',function(){
    document.querySelectorAll('.toggle-btn').forEach(function(b,bi){
      b.classList.remove('active');
      b.style.backgroundColor='#fff';
      b.style.color='#555';
      b.style.borderColor=classes[bi].color;
    });
    btn.classList.add('active');
    btn.style.backgroundColor=cls.color;
    btn.style.color='#fff';
    setActive(cls.id);
  });
  toggleContainer.appendChild(btn);
});

function getActiveClass(){
  for (var i=0;i<classes.length;i++) if(classes[i].id===activeId) return classes[i];
  return classes[2];
}

function update(t) {
  var cls=getActiveClass();
  var mU=interp(cls.upper,t), mL=interp(cls.lower,t);
  var yU=Math.max(T,Math.min(T+ph,magY(mU)));
  var yL=Math.max(T,Math.min(T+ph,magY(mL)));
  var x=typeX(t);
  vLine.setAttribute('x1',x); vLine.setAttribute('x2',x);
  hLineU.setAttribute('y1',yU); hLineU.setAttribute('y2',yU);
  hLineL.setAttribute('y1',yL); hLineL.setAttribute('y2',yL);
  dotU.setAttribute('cx',x); dotU.setAttribute('cy',yU);
  dotL.setAttribute('cx',x); dotL.setAttribute('cy',yL);
  outType.textContent=typeLabel(t);
  outMag.textContent=fmtMag(mU)+' to '+fmtMag(mL);
  outClass.textContent=cls.id;
}

slider.addEventListener('input',function(){ update(parseFloat(slider.value)); });
setActive('V');
update(parseFloat(slider.value));
</script>
</body>
</html>
