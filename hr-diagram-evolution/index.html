<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stellar Evolution on the H-R Diagram</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0E1320; --panel: #161D2E; --panel2: #1C2438;
    --ink: #E8ECF5; --muted: #8E99B3; --accent: #C792EA; --rule: #2A3450;
    --track: #2A3450;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex; justify-content: center; padding: 20px 12px;
  }
  .card { width: 100%; max-width: 720px; }
  .eyebrow { color: var(--accent); font-size: 12px; letter-spacing: .12em; text-transform: uppercase; margin-bottom: 6px; }
  h1 { font-size: 24px; margin-bottom: 4px; }
  .sub { color: var(--muted); font-size: 14px; margin-bottom: 14px; }

  .switch-row { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; cursor: pointer; user-select: none; }
  .switch-row input { position: absolute; opacity: 0; pointer-events: none; }
  .switch-row .knob {
    position: relative; width: 40px; height: 22px;
    background: var(--panel2); border: 1px solid var(--rule); border-radius: 11px;
    transition: background .15s, border-color .15s; flex-shrink: 0;
  }
  .switch-row .knob::after {
    content: ''; position: absolute; left: 2px; top: 2px;
    width: 16px; height: 16px; background: var(--muted);
    border-radius: 50%; transition: all .15s;
  }
  .switch-row input:checked + .knob { background: var(--accent); border-color: var(--accent); }
  .switch-row input:checked + .knob::after { left: 20px; background: var(--bg); }
  .switch-row .lab { color: var(--muted); font-size: 13px; transition: color .15s; }
  .switch-row input:checked ~ .lab { color: var(--ink); }

  canvas { width: 100%; height: auto; background: var(--panel); border: 1px solid var(--rule); border-radius: 10px; display: block; }

  .stage-banner {
    background: var(--panel2); border: 1px solid var(--rule); border-radius: 10px;
    padding: 12px 14px; margin: 12px 0; min-height: 140px;
  }
  .stage-banner .stage-main { font-size: 15px; line-height: 22px; min-height: 44px; }
  .stage-banner .stage-main strong { color: var(--accent); }
  .stage-banner .stage-extra { color: var(--muted); font-size: 13px; line-height: 18px; margin-top: 8px; }

  .readouts { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin: 12px 0; }
  .ro { background: var(--panel2); border: 1px solid var(--rule); border-radius: 10px; padding: 8px 12px; }
  .ro .k { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
  .ro .v { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 16px; margin-top: 2px; }

  .ctl { margin: 14px 0 8px; }
  .ctl label { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
  .ctl label .val { font-family: ui-monospace, Menlo, Consolas, monospace; color: var(--ink); }

  /* Slider with visible filled portion */
  input[type="range"] {
    -webkit-appearance: none; appearance: none;
    width: 100%; height: 6px; border-radius: 3px;
    background: var(--track);
    outline: none; cursor: pointer;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 18px; height: 18px; border-radius: 50%;
    background: #FFFFFF; border: 2px solid var(--accent);
    cursor: pointer; box-sizing: border-box;
  }
  input[type="range"]::-moz-range-thumb {
    width: 18px; height: 18px; border-radius: 50%;
    background: #FFFFFF; border: 2px solid var(--accent);
    cursor: pointer; box-sizing: border-box;
  }
  input[type="range"]::-moz-range-track { background: transparent; border: none; }

  /* Stage step buttons */
  .step-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
  .step-row button {
    appearance: none; -webkit-appearance: none;
    background-color: var(--panel2); color: var(--ink);
    border: 1px solid var(--muted); border-radius: 8px;
    padding: 10px 18px; font-family: inherit; font-size: 14px;
    cursor: pointer; text-align: center;
  }
  .step-row button:hover:not(:disabled) { border-color: var(--accent); }
  .step-row button:disabled { color: var(--muted); opacity: 0.45; cursor: default; }

  @media (max-width: 560px) { .readouts { grid-template-columns: repeat(2, 1fr); } }
</style>
</head>
<body>
<div class="card">
  <div class="eyebrow">Stellar Evolution &middot; Interactive 1 of 2</div>
  <h1>One Star's Life on the H-R Diagram</h1>
  <p class="sub">Choose a starting mass, then drag the life-stage slider to follow the star from protostar to its final state.</p>

  <label class="switch-row">
    <input type="checkbox" id="modeSwitch">
    <span class="knob"></span>
    <span class="lab">Show all giant phase details</span>
  </label>

  <canvas id="hr" width="720" height="540"></canvas>

  <div class="stage-banner">
    <div class="stage-main">Stage: <strong id="stageName">&mdash;</strong></div>
    <div class="stage-extra" id="stageExtra"></div>
  </div>

  <div class="readouts">
    <div class="ro"><div class="k">Time elapsed</div><div class="v" id="roTime">&mdash;</div></div>
    <div class="ro"><div class="k">Temperature</div><div class="v" id="roT">&mdash;</div></div>
    <div class="ro"><div class="k">Luminosity</div><div class="v" id="roL">&mdash;</div></div>
    <div class="ro"><div class="k">Radius</div><div class="v" id="roR">&mdash;</div></div>
  </div>

  <div class="ctl">
    <label>Starting mass <span class="val" id="massVal">1.0 M&#9737;</span></label>
    <input type="range" id="mass" min="0" max="1000" value="482">
  </div>
  <div class="ctl">
    <label>Life stage <span class="val" id="stageVal">start</span></label>
    <input type="range" id="stage" min="0" max="1000" value="0">
    <div class="step-row">
      <button id="prevStage">&larr; Previous stage</button>
      <button id="nextStage">Next stage &rarr;</button>
    </div>
  </div>
</div>

<script>
function bbRGB(T){
  var t=Math.max(10,T)/100,r,g,b;
  if(t<=66){r=255;}else{r=329.698727446*Math.pow(t-60,-0.1332047592);}
  if(t<=66){g=99.4708025861*Math.log(t)-161.1195681661;}else{g=288.1221695283*Math.pow(t-60,-0.0755148492);}
  if(t>=66){b=255;}else if(t<=19){b=0;}else{b=138.5177312231*Math.log(t-10)-305.0447927307;}
  function c(x){return Math.max(0,Math.min(255,Math.round(x)));}
  return "rgb("+c(r)+","+c(g)+","+c(b)+")";
}
function fmtL(L){
  if(L>=10000||L<0.01) return L.toExponential(1);
  if(L>=100) return Math.round(L).toLocaleString();
  if(L>=1) return L.toPrecision(3);
  return L.toPrecision(2);
}
function fmtTime(tMyr){
  if(tMyr<0.001) return Math.round(tMyr*1e6).toLocaleString()+" yr";
  if(tMyr<1) return (tMyr*1000).toPrecision(3)+" kyr";
  if(tMyr<1000) return tMyr.toPrecision(3)+" Myr";
  return (tMyr/1000).toPrecision(3)+" Gyr";
}
function buildTrack(M, detailed){
  var Tz=5772*Math.pow(M,0.6), Lz=Math.pow(M,3.5);
  var tMS=10000*Math.pow(M,-2.5);
  var Ltip=Math.max(1500,Lz*8);
  var Lagb=Math.max(4000,Lz*10);
  var pts=[];
  if(M<0.08){
    pts.push({T:3200,L:30*M,name:"Protostar &mdash; gravitational contraction",dur:0});
    pts.push({T:2700,L:1e-3,name:"Protostar &mdash; contraction, but the core never gets hot enough for hydrogen fusion",dur:60});
    pts.push({T:1800,L:1e-5,name:"Brown dwarf &mdash; a failed star, cooling forever",dur:1500});
    pts.push({T:1100,L:2e-6,name:"Brown dwarf &mdash; a failed star, cooling forever",dur:12000});
    return {pts:pts, sn:false, endNote:"Below 0.08 M\u2609 the core never reaches hydrogen-fusion temperature. A brown dwarf just keeps cooling and fading \u2014 forever."};
  }
  pts.push({T:3600,L:30*M,name:"Protostar &mdash; gravitational contraction",dur:0});
  if(M<=3.9){
    pts.push({T:3650,L:Math.max(Lz*0.65,1e-4),name:"Protostar &mdash; gravitational contraction",dur:30/(M*M)});
    pts.push({T:Tz,L:Lz,name:detailed?"Protostar &mdash; approaching the main sequence":"Protostar &mdash; gravitational contraction",dur:10/(M*M)});
  } else {
    pts.push({T:Tz,L:Lz,name:"Protostar &mdash; gravitational contraction",dur:40/(M*M)});
  }
  if(M<0.4){
    pts.push({T:Tz*0.95,L:Lz*1.6,name:"Red dwarf &mdash; hydrogen fusion in the core",dur:tMS});
    return {pts:pts, sn:false, endNote:"A red dwarf this small is fully convective and will never become a red giant. Its main-sequence lifetime is "+fmtTime(tMS)+" \u2014 so long that every red dwarf ever born is still on the main sequence today."};
  }
  pts.push({T:Tz*0.93,L:Lz*1.9,name:"Main sequence &mdash; hydrogen fusion in the core",dur:tMS});
  if(M<8){
    if(detailed){
      pts.push({T:5000,L:Lz*2.5,name:"Subgiant &mdash; core contracts, envelope expands",dur:0.04*tMS});
      pts.push({T:3650,L:Ltip,name:"Red giant &mdash; hydrogen fusion in a shell",dur:0.08*tMS});
      pts.push({T:5200,L:Math.max(50,Lz*1.2),name:"Horizontal branch &mdash; helium fusion in the core",dur:0.012*tMS});
      pts.push({T:3300,L:Lagb,name:"Asymptotic giant branch &mdash; double shell fusion",dur:0.004*tMS});
    } else {
      pts.push({T:3500,L:Lagb,name:"Red giant &mdash; the star expands, cools, and brightens",dur:0.136*tMS});
    }
    pts.push({T:90000,L:Lagb*0.8,name:"Planetary nebula &mdash; outer layers ejected",dur:0.05});
    pts.push({T:25000,L:0.03,name:"White dwarf &mdash; no fusion, slowly cooling",dur:1500});
    pts.push({T:5200,L:2e-4,name:"White dwarf &mdash; no fusion, slowly cooling",dur:9000});
    return {pts:pts, sn:false, endNote:null};
  }
  if(detailed){
    pts.push({T:5000,L:Lz*2.5,name:"Subgiant &mdash; core contracts, envelope expands",dur:0.04*tMS});
    pts.push({T:3650,L:Ltip,name:"Red supergiant &mdash; shell fusion",dur:0.08*tMS});
    pts.push({T:11000,L:Ltip*1.1,name:"Blue loop &mdash; helium fusion in the core",dur:0.01*tMS});
    pts.push({T:3700,L:Ltip*1.6,name:"Red supergiant &mdash; fusing heavier elements",dur:0.004*tMS});
  } else {
    pts.push({T:3650,L:Ltip*1.6,name:"Red supergiant &mdash; the star expands, cools, and brightens",dur:0.134*tMS});
  }
  return {pts:pts, sn:true, endNote:null};
}
function trackPoint(tr,s){
  var n=tr.pts.length-1;
  var x=s*n, i=Math.min(Math.floor(x),n-1), f=x-i;
  var a=tr.pts[i], b=tr.pts[i+1];
  var T=Math.pow(10, Math.log10(a.T)+f*(Math.log10(b.T)-Math.log10(a.T)));
  var L=Math.pow(10, Math.log10(a.L)+f*(Math.log10(b.L)-Math.log10(a.L)));
  var time=0;
  for(var k=1;k<=i;k++) time+=tr.pts[k].dur;
  time+=f*b.dur;
  return {T:T,L:L,name:b.name,time:time,segIndex:i,frac:f};
}
function stageBoundaries(tr){
  var n=tr.pts.length-1, bd=[0];
  for(var i=1;i<n;i++){
    if(tr.pts[i+1].name !== tr.pts[i].name) bd.push(i/n);
  }
  bd.push(1);
  return bd;
}

var cv=document.getElementById("hr"), ctx=cv.getContext("2d");
var W=cv.width,H=cv.height,mL=62,mR=16,mT=34,mB=58;
var logTmax=Math.log10(120000), logTmin=Math.log10(1000);
var logLmin=-6.5, logLmax=6.5;
function px(T){ return mL+(logTmax-Math.log10(T))/(logTmax-logTmin)*(W-mL-mR); }
function py(L){ return mT+(logLmax-Math.log10(L))/(logLmax-logLmin)*(H-mT-mB); }

function drawLogLabel(rightX, y, exp){
  ctx.font="9px sans-serif";
  var sExp=String(exp);
  var wExp=ctx.measureText(sExp).width;
  ctx.font="12px sans-serif";
  var w10=ctx.measureText("10").width;
  var xLeft = rightX - (w10 + 1 + wExp);
  ctx.textAlign="left";
  ctx.fillText("10", xLeft, y);
  ctx.font="9px sans-serif";
  ctx.fillText(sExp, xLeft+w10+1, y-5);
  ctx.font="12px sans-serif";
}

function drawBase(){
  ctx.clearRect(0,0,W,H);
  ctx.font="12px sans-serif";
  for(var e=-6;e<=6;e+=2){
    var y=py(Math.pow(10,e));
    ctx.strokeStyle="#222B42"; ctx.beginPath(); ctx.moveTo(mL,y); ctx.lineTo(W-mR,y); ctx.stroke();
    ctx.fillStyle="#8E99B3";
    if(e===0){ ctx.textAlign="right"; ctx.fillText("1", mL-6, y+4); }
    else drawLogLabel(mL-6, y+4, e);
  }
  var Ts=[100000,50000,20000,10000,5000,3000,1500];
  ctx.textAlign="center";
  Ts.forEach(function(T){
    var x=px(T);
    ctx.strokeStyle="#222B42"; ctx.beginPath(); ctx.moveTo(x,mT); ctx.lineTo(x,H-mB); ctx.stroke();
    ctx.fillStyle="#8E99B3"; ctx.font="12px sans-serif";
    ctx.fillText(T.toLocaleString(), x, H-mB+16);
  });
  ctx.fillStyle="#A8B5D1"; ctx.font="bold 12px sans-serif"; ctx.textAlign="center";
  ctx.fillText("Hot", px(100000), H-mB+32);
  ctx.fillText("Cool", px(1500), H-mB+32);
  ctx.fillStyle="#8E99B3"; ctx.font="12px sans-serif";
  ctx.fillText("Surface temperature (K)", W/2, H-8);
  ctx.save(); ctx.translate(14,H/2); ctx.rotate(-Math.PI/2);
  ctx.fillText("Luminosity (L\u2609)", 0,0); ctx.restore();
  var cls=[["O",60000],["B",17000],["A",8700],["F",6700],["G",5600],["K",4400],["M",3000]];
  ctx.fillStyle="#5E6B8C"; ctx.font="bold 13px sans-serif"; ctx.textAlign="center";
  cls.forEach(function(c){ ctx.fillText(c[0], px(c[1]), mT-10); });
  ctx.strokeStyle="rgba(127,141,179,0.55)"; ctx.setLineDash([5,5]); ctx.lineWidth=2; ctx.beginPath();
  var first=true;
  for(var m=0.08;m<=30;m*=1.08){
    var T=5772*Math.pow(m,0.6), L=Math.pow(m,3.5);
    if(T<1000||T>120000) continue;
    var x=px(T),y=py(L);
    if(first){ctx.moveTo(x,y);first=false;}else{ctx.lineTo(x,y);}
  }
  ctx.stroke(); ctx.setLineDash([]); ctx.lineWidth=1;
  ctx.fillStyle="#B8C2DA"; ctx.font="11px sans-serif"; ctx.textAlign="left";
  ctx.fillText("main sequence", px(3400), py(2e-4));
}
function drawTrack(tr,s){
  ctx.strokeStyle="#3A4668"; ctx.lineWidth=1.5; ctx.beginPath();
  tr.pts.forEach(function(p,i){ var x=px(p.T),y=py(p.L); if(i===0)ctx.moveTo(x,y); else ctx.lineTo(x,y); });
  ctx.stroke();
  var pt=trackPoint(tr,s);
  ctx.strokeStyle="#C792EA"; ctx.lineWidth=2.5; ctx.beginPath();
  for(var i=0;i<=pt.segIndex;i++){ var p=tr.pts[i],x=px(p.T),y=py(p.L); if(i===0)ctx.moveTo(x,y); else ctx.lineTo(x,y); }
  ctx.lineTo(px(pt.T),py(pt.L)); ctx.stroke(); ctx.lineWidth=1;
  var R=Math.sqrt(pt.L)*Math.pow(5772/pt.T,2);
  var size=Math.max(3,Math.min(26, 6+4*Math.log10(R)));
  var x=px(pt.T), y=py(pt.L);
  if(tr.sn && s>0.997){
    ctx.strokeStyle="#FFD166"; ctx.lineWidth=2;
    for(var a=0;a<12;a++){
      var ang=a*Math.PI/6;
      ctx.beginPath(); ctx.moveTo(x+8*Math.cos(ang),y+8*Math.sin(ang));
      ctx.lineTo(x+24*Math.cos(ang),y+24*Math.sin(ang)); ctx.stroke();
    }
    ctx.fillStyle="#FFFFFF"; ctx.beginPath(); ctx.arc(x,y,7,0,7); ctx.fill();
    ctx.lineWidth=1;
  } else {
    var col=bbRGB(pt.T);
    ctx.shadowColor=col; ctx.shadowBlur=14;
    ctx.fillStyle=col; ctx.beginPath(); ctx.arc(x,y,size,0,7); ctx.fill();
    ctx.shadowBlur=0;
  }
  return pt;
}

var massSl=document.getElementById("mass"), stageSl=document.getElementById("stage");
var massVal=document.getElementById("massVal"), stageVal=document.getElementById("stageVal");
var stageName=document.getElementById("stageName"), stageExtra=document.getElementById("stageExtra");
var roTime=document.getElementById("roTime"), roT=document.getElementById("roT"),
    roL=document.getElementById("roL"), roR=document.getElementById("roR");
var modeSwitch=document.getElementById("modeSwitch");
var prevBtn=document.getElementById("prevStage"), nextBtn=document.getElementById("nextStage");
function detailedMode(){ return modeSwitch.checked; }

function paintSlider(el){
  var pct=(el.value-el.min)/(el.max-el.min)*100;
  el.style.background="linear-gradient(to right, #C792EA 0%, #C792EA "+pct+"%, #2A3450 "+pct+"%, #2A3450 100%)";
}

function getMass(){ return 0.05*Math.pow(25/0.05, massSl.value/1000); }
function fmtMass(M){
  if(M<0.1) return M.toFixed(3);
  if(M<3) return M.toFixed(1);
  return M.toFixed(0);
}

function update(){
  var M=getMass();
  massVal.innerHTML=fmtMass(M)+" M\u2609"+(M<0.08?" (below fusion limit)":"");
  var tr=buildTrack(M,detailedMode());
  var s=stageSl.value/1000;
  drawBase();
  var pt=drawTrack(tr,s);
  if(tr.sn && s>0.997){
    stageName.innerHTML="Core-collapse supernova! The core becomes a neutron star or black hole &mdash; off the diagram.";
  } else {
    stageName.innerHTML=pt.name;
  }
  var extras=[];
  if(tr.endNote && s>0.97) extras.push(tr.endNote);
  if(pt.time>13800) extras.push("Note: "+fmtTime(pt.time)+" is more time than the universe has existed so far (13.8 Gyr).");
  stageExtra.innerHTML=extras.join(" ");
  stageVal.textContent=(s*100).toFixed(0)+"%";
  roTime.innerHTML=fmtTime(pt.time);
  roT.innerHTML=Math.round(pt.T).toLocaleString()+" K";
  roL.innerHTML=fmtL(pt.L)+" L\u2609";
  var R=Math.sqrt(pt.L)*Math.pow(5772/pt.T,2);
  roR.innerHTML=(R>=100?Math.round(R).toLocaleString():R.toPrecision(2))+" R\u2609";
  var bd=stageBoundaries(tr);
  prevBtn.disabled = s<=bd[0]+0.0001;
  nextBtn.disabled = s>=bd[bd.length-1]-0.0001;
  paintSlider(massSl); paintSlider(stageSl);
}

function jumpStage(dir){
  var tr=buildTrack(getMass(),detailedMode());
  var bd=stageBoundaries(tr);
  var s=stageSl.value/1000, target=null, eps=0.002;
  if(dir>0){
    for(var i=0;i<bd.length;i++){ if(bd[i]>s+eps){ target=bd[i]; break; } }
    if(target===null) target=bd[bd.length-1];
  } else {
    for(var j=bd.length-1;j>=0;j--){ if(bd[j]<s-eps){ target=bd[j]; break; } }
    if(target===null) target=bd[0];
  }
  stageSl.value=Math.round(target*1000);
  update();
}

massSl.addEventListener("input",update);
stageSl.addEventListener("input",update);
modeSwitch.addEventListener("change",update);
prevBtn.addEventListener("click",function(){ jumpStage(-1); });
nextBtn.addEventListener("click",function(){ jumpStage(1); });
update();
</script>
</body>
</html>
